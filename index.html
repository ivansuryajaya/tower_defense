<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tower Defence</title>
<style>
  :root {
  --bg: #0c111c;
  --panel: #151d2e;
  --panel-2: #1c2740;
  --line: #26314c;
  --text: #e7edff;
  --muted: #93a3c7;
  --accent: #5b8cff;
  --gold: #ffd75e;
  --danger: #ff5f6d;
  --ok: #57d9a3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:
    radial-gradient(1200px 600px at 20% -10%, #17223c 0%, transparent 60%),
    radial-gradient(900px 500px at 100% 0%, #1a1430 0%, transparent 55%),
    var(--bg);
}

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px;
}

/* ---------- HUD ---------- */
.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}

.stat {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 92px;
  padding: 7px 12px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.stat.gold span:last-child { color: var(--gold); }
.ico { font-size: 14px; }
.spacer { flex: 1; }

/* ---------- Layout ---------- */
.main {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-top: 14px;
}

.board-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #0a0f18;
  cursor: crosshair;
}

.sidebar {
  width: 276px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
}

.panel h2 {
  margin: 0 0 10px;
  font-size: 12px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 700;
}

/* ---------- Tower cards ---------- */
.tower-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tower-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  text-align: left;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  color: var(--text);
  cursor: pointer;
  transition: border-color .12s, transform .08s, background .12s;
}

.tower-card:hover { border-color: #3a4a74; transform: translateY(-1px); }

.tower-card.selected {
  border-color: var(--accent);
  background: #1f2c4d;
  box-shadow: 0 0 0 2px rgba(91, 140, 255, .22);
}

.tower-card.unaffordable { opacity: .48; }

.swatch {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  flex-shrink: 0;
  border: 2px solid rgba(0, 0, 0, .35);
  box-shadow: inset 0 -6px 10px rgba(0, 0, 0, .28);
}

.tc-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tc-name { font-size: 13.5px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.tc-cost { color: var(--gold); font-size: 12.5px; }
.tc-desc { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.tc-key {
  font-size: 10px;
  color: var(--muted);
  background: #101728;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 1px 5px;
  margin-left: 6px;
}

/* ---------- Info panel ---------- */
.info-panel { display: flex; flex-direction: column; gap: 10px; }
.ip-head { display: flex; align-items: center; gap: 10px; }
.ip-swatch {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  border: 2px solid rgba(0, 0, 0, .35);
}
.ip-name { font-weight: 800; font-size: 15px; }
.ip-level { font-size: 11.5px; color: var(--muted); }
.ip-stats {
  font-size: 12px;
  color: #c6d2f0;
  line-height: 1.65;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
}
.ip-stats b { color: #fff; font-variant-numeric: tabular-nums; }
.ip-actions { display: flex; gap: 8px; }
.ip-actions .btn { flex: 1; }

/* ---------- Buttons ---------- */
.btn {
  font: inherit;
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  cursor: pointer;
  transition: filter .12s, transform .08s, opacity .12s;
}

.btn:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn.primary {
  background: linear-gradient(180deg, #4f83ff, #3a63e0);
  border-color: #4b76ea;
  color: #fff;
}

.btn.danger {
  background: #3a1b26;
  border-color: #6d2a3a;
  color: #ff9aa5;
}

.btn.small { padding: 7px 11px; font-size: 12.5px; }
.btn.wide { width: 100%; padding: 12px; font-size: 14.5px; margin-top: 10px; }

/* ---------- Side info rows ---------- */
.row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  color: var(--muted);
}
.row .value { color: var(--text); font-weight: 700; text-align: right; }

.hint {
  margin: 2px 0 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}
.hint b { color: #b9c6e8; }

/* ---------- Toast ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 16px;
  transform: translate(-50%, 12px);
  padding: 9px 16px;
  background: rgba(16, 22, 38, .95);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  color: #ffd75e;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  z-index: 4;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Overlay ---------- */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(7, 10, 18, .82);
  backdrop-filter: blur(4px);
  border-radius: 14px;
  z-index: 5;
}

.overlay-card {
  text-align: center;
  padding: 26px 30px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
}

.overlay-card h1 { margin: 0 0 6px; font-size: 26px; }
.overlay-card h1.lose { color: var(--danger); }
.overlay-card h1.win { color: var(--ok); }
.overlay-card p { margin: 0 0 14px; color: var(--muted); font-size: 13.5px; }

.overlay-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 16px;
}

.overlay-stats div {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px;
  font-size: 12px;
  color: var(--muted);
}
.overlay-stats b { display: block; font-size: 17px; color: var(--text); margin-top: 2px; }

.hidden { display: none !important; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .main { flex-direction: column; }
  .sidebar { width: 100%; }
  .tower-list { display: grid; grid-template-columns: 1fr 1fr; }
}

</style>
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="stat"><span class="ico">❤️</span><span id="lives">20</span></div>
      <div class="stat gold"><span class="ico">💰</span><span id="gold">250</span></div>
      <div class="stat"><span class="ico">🌊</span><span id="wave">0 / 20</span></div>
      <div class="stat"><span class="ico">🏆</span><span id="score">0</span></div>
      <div class="spacer"></div>
      <button id="speedBtn" class="btn small" type="button">Speed 1x</button>
      <button id="pauseBtn" class="btn small" type="button">Pause</button>
    </header>

    <main class="main">
      <div class="board-wrap">
        <canvas id="game" width="720" height="480"></canvas>

        <div id="toast" class="toast"></div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1 id="overlayTitle">Game Over</h1>
            <p id="overlayText">The horde broke through.</p>
            <div class="overlay-stats" id="overlayStats"></div>
            <button id="restartBtn" class="btn primary" type="button">Play Again</button>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <section class="panel">
          <h2>Build towers</h2>
          <div id="towerList" class="tower-list"></div>
        </section>

        <section id="infoPanel" class="panel info-panel hidden">
          <div class="ip-head">
            <span class="ip-swatch" id="ipSwatch"></span>
            <div>
              <div class="ip-name" id="ipName">Gunner</div>
              <div class="ip-level" id="ipLevel">Level 1 / 3</div>
            </div>
          </div>
          <div class="ip-stats" id="ipStats"></div>
          <div class="ip-actions">
            <button id="upgradeBtn" class="btn primary" type="button">Upgrade</button>
            <button id="sellBtn" class="btn danger" type="button">Sell</button>
          </div>
        </section>

        <section class="panel">
          <div class="row">
            <span class="label">Next wave</span>
            <span class="value" id="nextWave">—</span>
          </div>
          <button id="startBtn" class="btn primary wide" type="button">▶ Start Wave 1</button>
        </section>

        <p class="hint">
          Pick a tower, then click a grass tile to build (towers can't go on the road).
          Click a placed tower to upgrade or sell it.<br />
          <b>Keys:</b> 1–4 build · Esc / right-click cancel · Space start wave
        </p>
      </aside>
    </main>
  </div>

  <script>
    "use strict";

/* ==========================================================================
   Tower Defence — vanilla JS + Canvas
   ========================================================================== */

/* ---------------------------- Config ------------------------------------- */
const TILE = 40;
const COLS = 18;
const ROWS = 12;
const W = COLS * TILE;          // 720
const H = ROWS * TILE;          // 480
const MAX_WAVES = 20;
const START_GOLD = 250;
const START_LIVES = 20;
const SELL_RATIO = 0.7;

// Enemy path as tile coordinates (first/last are off-map: entry & exit portals)
const WAYPOINT_TILES = [
  [-1, 1], [16, 1], [16, 4], [2, 4], [2, 7], [16, 7], [16, 10], [18, 10],
];
const WAYPOINTS = WAYPOINT_TILES.map(([c, r]) => ({ x: (c + 0.5) * TILE, y: (r + 0.5) * TILE }));

// Tiles covered by the road (cannot build on these)
const pathSet = new Set();
for (let i = 0; i < WAYPOINT_TILES.length - 1; i++) {
  const [c1, r1] = WAYPOINT_TILES[i];
  const [c2, r2] = WAYPOINT_TILES[i + 1];
  if (r1 === r2) {
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) pathSet.add(`${c},${r1}`);
  } else {
    for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) pathSet.add(`${c1},${r}`);
  }
}

/* ---------------------------- Towers ------------------------------------- */
const TOWER_TYPES = {
  gunner: {
    id: 'gunner', name: 'Gunner', cost: 50, color: '#4fc3f7', key: '1',
    desc: 'Rapid fire, cheap single target.',
    pierce: 'none', projSpeed: 560,
    levels: [
      { dmg: 12, rate: 0.50, range: 112 },
      { dmg: 24, rate: 0.42, range: 126, cost: 45 },
      { dmg: 45, rate: 0.32, range: 148, cost: 85 },
    ],
  },
  cannon: {
    id: 'cannon', name: 'Cannon', cost: 120, color: '#ff8a65', key: '2',
    desc: 'Splash damage, ignores 50% armour.',
    pierce: 'half', projSpeed: 320,
    levels: [
      { dmg: 46, rate: 1.60, range: 122, splash: 56 },
      { dmg: 82, rate: 1.50, range: 132, splash: 66, cost: 95 },
      { dmg: 145, rate: 1.35, range: 148, splash: 82, cost: 160 },
    ],
  },
  frost: {
    id: 'frost', name: 'Frost', cost: 80, color: '#80deea', key: '3',
    desc: 'Slows enemies so other towers hit more.',
    pierce: 'none', projSpeed: 420,
    levels: [
      { dmg: 6, rate: 0.90, range: 104, slow: 0.55, slowDur: 1.6 },
      { dmg: 13, rate: 0.80, range: 118, slow: 0.48, slowDur: 2.0, cost: 65 },
      { dmg: 24, rate: 0.70, range: 134, slow: 0.40, slowDur: 2.6, cost: 110 },
    ],
  },
  sniper: {
    id: 'sniper', name: 'Sniper', cost: 150, color: '#aed581', key: '4',
    desc: 'Huge range and damage, ignores all armour.',
    pierce: 'full', projSpeed: 900,
    levels: [
      { dmg: 72, rate: 2.20, range: 255 },
      { dmg: 135, rate: 2.00, range: 295, cost: 120 },
      { dmg: 250, rate: 1.75, range: 340, cost: 200 },
    ],
  },
};
const TOWER_ORDER = ['gunner', 'cannon', 'frost', 'sniper'];

/* ---------------------------- Enemies ------------------------------------ */
const ENEMY_TYPES = {
  grunt:  { name: 'Grunt',  plural: 'Grunts',  hp: 90,   speed: 55,  armour: 1,  bounty: 9,   r: 9,  color: '#e57373', stroke: '#b34747', lives: 1 },
  runner: { name: 'Runner', plural: 'Runners', hp: 62,   speed: 128, armour: 0,  bounty: 10,  r: 7,  color: '#fff176', stroke: '#c9b339', lives: 1 },
  tank:   { name: 'Tank',   plural: 'Tanks',   hp: 340,  speed: 38,  armour: 7,  bounty: 24,  r: 12, color: '#8d6e63', stroke: '#5d453b', lives: 2 },
  boss:   { name: 'Boss',   plural: 'Bosses',  hp: 1650, speed: 42,  armour: 14, bounty: 220, r: 18, color: '#ba68c8', stroke: '#7b3f91', lives: 5 },
};

const HP_SCALE = 0.18;   // +18% enemy hp per wave
const SPEED_SCALE = 0.015;
const BOUNTY_SCALE = 0.06;

function generateWave(n) {
  const out = [];
  const add = (type, count, gap) => {
    for (let i = 0; i < count; i++) out.push({ type, gap });
  };
  if (n % 5 === 0) {
    add('grunt', 6 + Math.floor(n * 1.5), 0.55);
    add('tank', 2 + Math.floor(n / 3), 0.95);
    add('runner', 4 + n, 0.35);
    add('boss', 1 + Math.floor(n / 10), 1.8);
  } else {
    add('grunt', 5 + n * 2, 0.6);
    if (n >= 3) add('runner', (n - 2) * 2, 0.35);
    if (n >= 4) add('tank', 1 + Math.floor((n - 1) / 3), 0.9);
    if (n >= 8) add('tank', Math.floor(n / 4), 0.75);
  }
  return out;
}

function waveSummary(n) {
  if (n > MAX_WAVES) return '—';
  const counts = {};
  for (const s of generateWave(n)) counts[s.type] = (counts[s.type] || 0) + 1;
  return Object.entries(counts)
    .map(([t, c]) => `${c} ${c > 1 ? ENEMY_TYPES[t].plural : ENEMY_TYPES[t].name}`)
    .join(' · ');
}

/* ---------------------------- Helpers ------------------------------------ */
const $ = (id) => document.getElementById(id);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function setText(el, v) {
  if (el._v !== v) { el._v = v; el.textContent = v; }
}

/* ---------------------------- Game state --------------------------------- */
const canvas = $('game');
const ctx = canvas.getContext('2d');
const DPR = window.devicePixelRatio || 1;
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

const game = {};

function resetGame() {
  Object.assign(game, {
    gold: START_GOLD,
    lives: START_LIVES,
    wave: 0,
    score: 0,
    kills: 0,
    state: 'idle',          // idle | wave | over | won
    towers: [],
    enemies: [],
    projectiles: [],
    effects: [],
    popups: [],
    queue: [],
    spawnTimer: 0,
    selectedType: null,
    selectedTower: null,
    hover: null,
    speed: 1,
    paused: false,
    banner: null,
    shake: 0,
    time: 0,
  });
  hideOverlay();
  lastPanelTower = undefined;
}

/* ---------------------------- Entities ----------------------------------- */
class Enemy {
  constructor(type, wave) {
    const base = ENEMY_TYPES[type];
    const hpMul = 1 + (wave - 1) * HP_SCALE;
    this.type = type;
    this.maxHp = Math.round(base.hp * hpMul);
    this.hp = this.maxHp;
    this.speed = base.speed * (1 + Math.min(0.35, (wave - 1) * SPEED_SCALE));
    this.armour = base.armour;
    this.bounty = Math.max(1, Math.round(base.bounty * (1 + (wave - 1) * BOUNTY_SCALE)));
    this.livesCost = base.lives;
    this.r = base.r;
    this.color = base.color;
    this.stroke = base.stroke;
    this.x = WAYPOINTS[0].x;
    this.y = WAYPOINTS[0].y;
    this.wp = 1;
    this.travelled = 0;
    this.slowFactor = 1;
    this.slowTimer = 0;
    this.hitFlash = 0;
    this.remove = false;
    this.dead = false;
  }

  applySlow(factor, dur) {
    this.slowFactor = Math.min(this.slowFactor, factor);
    this.slowTimer = Math.max(this.slowTimer, dur);
  }

  update(dt) {
    if (this.remove) return;
    if (this.slowTimer > 0) {
      this.slowTimer -= dt;
      if (this.slowTimer <= 0) this.slowFactor = 1;
    }
    if (this.hitFlash > 0) this.hitFlash -= dt;

    let move = this.speed * this.slowFactor * dt;
    this.travelled += move;

    while (move > 0) {
      const wp = WAYPOINTS[this.wp];
      if (!wp) {
        // reached the exit
        this.remove = true;
        this.dead = true;
        game.lives = Math.max(0, game.lives - this.livesCost);
        game.shake = 0.35;
        addPopup(W - 46, this.y, `-${this.livesCost} ❤️`, '#ff6b7a');
        break;
      }
      const dx = wp.x - this.x;
      const dy = wp.y - this.y;
      const d = Math.hypot(dx, dy);
      if (d <= move) {
        this.x = wp.x; this.y = wp.y; this.wp++; move -= d;
      } else {
        this.x += (dx / d) * move;
        this.y += (dy / d) * move;
        move = 0;
      }
    }
  }
}

class Tower {
  constructor(type, col, row) {
    const info = TOWER_TYPES[type];
    this.type = type;
    this.col = col;
    this.row = row;
    this.x = (col + 0.5) * TILE;
    this.y = (row + 0.5) * TILE;
    this.level = 1;
    this.spent = info.cost;
    this.cd = 0;
    this.angle = -Math.PI / 2;
  }

  stats() {
    const info = TOWER_TYPES[this.type];
    return Object.assign({}, info.levels[this.level - 1], {
      pierce: info.pierce,
      projSpeed: info.projSpeed,
    });
  }

  update(dt) {
    this.cd -= dt;
    const s = this.stats();
    const target = findTarget(this.x, this.y, s.range);
    if (target) this.angle = Math.atan2(target.y - this.y, target.x - this.x);
    if (this.cd <= 0 && target) {
      this.fire(target, s);
      this.cd = s.rate;
    }
  }

  fire(target, s) {
    const info = TOWER_TYPES[this.type];
    const muzzle = 12;
    game.projectiles.push(new Projectile({
      x: this.x + Math.cos(this.angle) * muzzle,
      y: this.y + Math.sin(this.angle) * muzzle,
      target,
      speed: s.projSpeed,
      dmg: s.dmg,
      pierce: s.pierce,
      splash: s.splash || 0,
      slow: s.slow || 0,
      slowDur: s.slowDur || 0,
      color: info.color,
      r: this.type === 'cannon' ? 5 : 3,
    }));
    game.effects.push({ kind: 'flash', x: this.x + Math.cos(this.angle) * muzzle, y: this.y + Math.sin(this.angle) * muzzle, life: 0.08, maxLife: 0.08, color: info.color });
  }
}

class Projectile {
  constructor(o) {
    Object.assign(this, o);
    this.tx = o.target ? o.target.x : o.x;
    this.ty = o.target ? o.target.y : o.y;
    this.life = 4;
    this.remove = false;
  }

  update(dt) {
    if (this.remove) return;
    if (this.target && !this.target.remove) {
      this.tx = this.target.x;
      this.ty = this.target.y;
    }
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;
    if (d <= step) { this.impact(); return; }
    this.x += (dx / d) * step;
    this.y += (dy / d) * step;
    this.life -= dt;
    if (this.life <= 0) this.remove = true;
  }

  impact() {
    this.remove = true;
    if (this.splash > 0) {
      game.effects.push({ kind: 'boom', x: this.tx, y: this.ty, r: this.splash, life: 0.3, maxLife: 0.3, color: '#ffb27a' });
      game.shake = Math.max(game.shake, 0.12);
      for (const e of game.enemies) {
        if (!e.remove && dist(this.tx, this.ty, e.x, e.y) <= this.splash + e.r) {
          damageEnemy(e, this.dmg, this.pierce);
        }
      }
    } else if (this.target && !this.target.remove) {
      damageEnemy(this.target, this.dmg, this.pierce);
      if (this.slow > 0) this.target.applySlow(this.slow, this.slowDur);
      game.effects.push({ kind: 'spark', x: this.tx, y: this.ty, r: 12, life: 0.14, maxLife: 0.14, color: this.color });
    } else {
      game.effects.push({ kind: 'spark', x: this.tx, y: this.ty, r: 6, life: 0.12, maxLife: 0.12, color: '#95a5c0' });
    }
  }
}

/* ---------------------------- Combat ------------------------------------- */
function findTarget(x, y, range) {
  let best = null;
  for (const e of game.enemies) {
    if (e.remove) continue;
    if (dist(x, y, e.x, e.y) <= range) {
      if (!best || e.travelled > best.travelled) best = e;
    }
  }
  return best;
}

function damageEnemy(e, dmg, pierce) {
  if (e.remove) return;
  let armour = e.armour;
  if (pierce === 'half') armour *= 0.5;
  if (pierce === 'full') armour = 0;
  const real = Math.max(1, Math.round(dmg - armour));
  e.hp -= real;
  e.hitFlash = 0.1;
  if (e.hp <= 0) {
    e.hp = 0;
    e.dead = true;
    e.remove = true;
    game.gold += e.bounty;
    game.score += e.bounty;
    game.kills += 1;
    addPopup(e.x, e.y - e.r, `+${e.bounty}`, '#ffd75e');
    game.effects.push({ kind: 'boom', x: e.x, y: e.y, r: e.r * 2.2, life: 0.28, maxLife: 0.28, color: e.color });
  }
}

/* ---------------------------- FX ----------------------------------------- */
function addPopup(x, y, text, color) {
  game.popups.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
}

function showBanner(text, color = '#ffffff') {
  game.banner = { text, color, life: 1.8, maxLife: 1.8 };
}

/* ---------------------------- Flow --------------------------------------- */
function startWave() {
  if (game.state === 'over' || game.state === 'won' || game.paused) return;
  if (game.state === 'wave' && game.queue.length > 0) return;   // still spawning
  if (game.state !== 'idle' && game.state !== 'wave') return;

  if (game.state === 'wave' && game.enemies.length > 0) {
    const bonus = game.enemies.length * 8;
    game.gold += bonus;
    showBanner(`Early call bonus  +${bonus} 💰`, '#ffd75e');
  }

  game.wave += 1;
  game.queue = generateWave(game.wave).map((g) => ({ type: g.type, gap: g.gap }));
  game.spawnTimer = 0.4;
  game.state = 'wave';
  showBanner(game.wave % 5 === 0 ? `⚠ Wave ${game.wave} — Boss wave!` : `Wave ${game.wave}`,
    game.wave % 5 === 0 ? '#ff9aa5' : '#ffffff');
}

function waveCleared() {
  const reward = 40 + game.wave * 12;
  game.gold += reward;
  game.score += 50 * game.wave;
  if (game.wave >= MAX_WAVES) {
    game.state = 'won';
    game.score += game.lives * 100;
    showOverlay('Victory!', `You survived all ${MAX_WAVES} waves.`, true);
  } else {
    game.state = 'idle';
    showBanner(`Wave ${game.wave} cleared!  +${reward} 💰`, '#57d9a3');
  }
}

function gameOver() {
  game.state = 'over';
  showOverlay('Game Over', `The horde broke through on wave ${game.wave}.`, false);
}

function canAfford(type) { return game.gold >= TOWER_TYPES[type].cost; }

function buildableTile(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return false;
  if (pathSet.has(`${col},${row}`)) return false;
  return !towerAt(col, row);
}

function towerAt(col, row) {
  return game.towers.find((t) => t.col === col && t.row === row) || null;
}

function tryPlace(col, row) {
  const type = game.selectedType;
  if (!type) return;
  const info = TOWER_TYPES[type];
  if (!buildableTile(col, row)) { toast('Cannot build there'); return; }
  if (game.gold < info.cost) { toast('Not enough gold'); return; }

  game.gold -= info.cost;
  const t = new Tower(type, col, row);
  game.towers.push(t);
  game.selectedTower = null;
  game.effects.push({ kind: 'ring', x: t.x, y: t.y, r: 34, life: 0.25, maxLife: 0.25, color: info.color });

  if (!canAfford(type)) game.selectedType = null; // ran out of money
}

function upgradeSelected() {
  const t = game.selectedTower;
  if (!t) return;
  const info = TOWER_TYPES[t.type];
  const next = info.levels[t.level];
  if (!next) { toast('Max level reached'); return; }
  if (game.gold < next.cost) { toast('Not enough gold'); return; }
  game.gold -= next.cost;
  t.spent += next.cost;
  t.level += 1;
  game.effects.push({ kind: 'ring', x: t.x, y: t.y, r: 40, life: 0.3, maxLife: 0.3, color: '#ffd75e' });
  showBanner(`${info.name} → Level ${t.level}`, '#ffd75e');
}

function sellSelected() {
  const t = game.selectedTower;
  if (!t) return;
  const value = Math.round(t.spent * SELL_RATIO);
  game.gold += value;
  game.towers.splice(game.towers.indexOf(t), 1);
  game.selectedTower = null;
  addPopup(t.x, t.y, `+${value}`, '#ffd75e');
}

/* ---------------------------- Update ------------------------------------- */
function update(dt) {
  game.time += dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 1.6);

  // spawn from queue
  if (game.queue.length) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      const item = game.queue.shift();
      game.enemies.push(new Enemy(item.type, game.wave));
      game.spawnTimer = game.queue.length ? game.queue[0].gap : 0;
    }
  }

  for (const e of game.enemies) e.update(dt);
  for (const t of game.towers) t.update(dt);
  for (const p of game.projectiles) p.update(dt);

  // effects / popups / banner
  for (const f of game.effects) f.life -= dt;
  for (const p of game.popups) { p.life -= dt; p.y -= 26 * dt; }
  if (game.banner) game.banner.life -= dt;

  game.enemies = game.enemies.filter((e) => !e.remove);
  game.projectiles = game.projectiles.filter((p) => !p.remove);
  game.effects = game.effects.filter((f) => f.life > 0);
  game.popups = game.popups.filter((p) => p.life > 0);
  if (game.banner && game.banner.life <= 0) game.banner = null;

  if (game.lives <= 0 && game.state !== 'over') { gameOver(); return; }
  if (game.state === 'wave' && game.queue.length === 0 && game.enemies.length === 0) waveCleared();
}

/* ---------------------------- Render ------------------------------------- */
function drawMap() {
  // grass
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.fillStyle = (r + c) % 2 ? '#1e3320' : '#22391f';
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
    }
  }
  // subtle grid
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let c = 0; c <= COLS; c++) { ctx.moveTo(c * TILE + 0.5, 0); ctx.lineTo(c * TILE + 0.5, H); }
  for (let r = 0; r <= ROWS; r++) { ctx.moveTo(0, r * TILE + 0.5); ctx.lineTo(W, r * TILE + 0.5); }
  ctx.stroke();

  // road (outline then fill)
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  const strokePath = (color, width) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(WAYPOINTS[0].x, WAYPOINTS[0].y);
    for (let i = 1; i < WAYPOINTS.length; i++) ctx.lineTo(WAYPOINTS[i].x, WAYPOINTS[i].y);
    ctx.stroke();
  };
  strokePath('#0d1522', TILE * 0.94);
  strokePath('#9c7a49', TILE * 0.80);
  strokePath('#b8925b', TILE * 0.60);

  // portals
  const pulse = 0.6 + Math.sin(game.time * 3) * 0.4;
  ctx.lineWidth = 4;
  ctx.strokeStyle = `rgba(170,120,255,${0.5 + pulse * 0.4})`;
  ctx.beginPath(); ctx.arc(2, WAYPOINTS[0].y, 16 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(120,70,220,0.35)';
  ctx.beginPath(); ctx.arc(2, WAYPOINTS[0].y, 13, 0, Math.PI * 2); ctx.fill();

  const exit = WAYPOINTS[WAYPOINTS.length - 1];
  ctx.strokeStyle = `rgba(255,120,90,${0.5 + pulse * 0.4})`;
  ctx.beginPath(); ctx.arc(W - 6, exit.y, 16 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(220,70,50,0.35)';
  ctx.beginPath(); ctx.arc(W - 6, exit.y, 13, 0, Math.PI * 2); ctx.fill();
}

function drawRange(x, y, range, ok) {
  ctx.beginPath();
  ctx.arc(x, y, range, 0, Math.PI * 2);
  ctx.fillStyle = ok ? 'rgba(120,190,255,0.09)' : 'rgba(255,90,90,0.10)';
  ctx.fill();
  ctx.strokeStyle = ok ? 'rgba(140,200,255,0.5)' : 'rgba(255,110,110,0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawTower(t, ghost = false) {
  const info = TOWER_TYPES[t.type];
  const x = ghost ? (t.col + 0.5) * TILE : t.x;
  const y = ghost ? (t.row + 0.5) * TILE : t.y;

  ctx.save();
  if (ghost) ctx.globalAlpha = 0.65;

  // base plate
  roundRectPath(ctx, x - 15, y - 15, 30, 30, 7);
  ctx.fillStyle = '#33445c';
  ctx.fill();
  ctx.strokeStyle = '#202d40';
  ctx.lineWidth = 2;
  ctx.stroke();

  // turret
  ctx.translate(x, y);
  ctx.rotate(t.angle || -Math.PI / 2);
  ctx.fillStyle = info.color;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 1.5;

  if (t.type === 'cannon') {
    ctx.fillRect(2, -4.5, 15, 9);
    ctx.strokeRect(2, -4.5, 15, 9);
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (t.type === 'sniper') {
    ctx.fillRect(2, -2, 22, 4);
    ctx.strokeRect(2, -2, 22, 4);
    ctx.beginPath(); ctx.arc(0, 0, 8.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (t.type === 'frost') {
    ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * -6, Math.sin(a) * -6);
      ctx.lineTo(Math.cos(a) * 6, Math.sin(a) * 6);
      ctx.stroke();
    }
  } else {
    ctx.fillRect(2, -2.5, 13, 5);
    ctx.strokeRect(2, -2.5, 13, 5);
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // level pips
  if (!ghost) {
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc(x - 8 + i * 8, y + 17.5, 2.4, 0, Math.PI * 2);
      ctx.fillStyle = i < t.level ? '#ffd75e' : 'rgba(255,255,255,0.18)';
      ctx.fill();
    }
  }
}

function drawEnemies() {
  for (const e of game.enemies) {
    // shadow
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + e.r * 0.85, e.r * 0.9, e.r * 0.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fill();

    // body
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fillStyle = e.color;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = e.stroke;
    ctx.stroke();

    if (e.hitFlash > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.min(0.85, e.hitFlash * 8)})`;
      ctx.fill();
    }

    // slow indicator
    if (e.slowTimer > 0) {
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r + 3.5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(150,235,255,0.85)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // hp bar
    const bw = Math.max(20, e.r * 2.4);
    const bx = e.x - bw / 2;
    const by = e.y - e.r - 9;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
    const frac = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = frac > 0.55 ? '#57d9a3' : frac > 0.25 ? '#ffd75e' : '#ff5f6d';
    ctx.fillRect(bx, by, bw * frac, 3);
  }
}

function drawProjectiles() {
  for (const p of game.projectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - (p.tx - p.x) * 0.05, p.y - (p.ty - p.y) * 0.05);
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = 0.45;
    ctx.lineWidth = p.r * 1.2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawEffects() {
  for (const f of game.effects) {
    const k = f.life / f.maxLife; // 1 → 0
    if (f.kind === 'boom') {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1.25 - k * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = hexA(f.color, 0.35 * k);
      ctx.fill();
      ctx.strokeStyle = hexA('#ffffff', 0.5 * k);
      ctx.lineWidth = 2;
      ctx.stroke();
    } else if (f.kind === 'spark') {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1.4 - k), 0, Math.PI * 2);
      ctx.fillStyle = hexA(f.color, 0.8 * k);
      ctx.fill();
    } else if (f.kind === 'ring') {
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (1.1 - k), 0, Math.PI * 2);
      ctx.strokeStyle = hexA(f.color, k);
      ctx.lineWidth = 2.5;
      ctx.stroke();
    } else if (f.kind === 'flash') {
      ctx.beginPath();
      ctx.arc(f.x, f.y, 4 * k + 1, 0, Math.PI * 2);
      ctx.fillStyle = hexA(f.color, k);
      ctx.fill();
    }
  }
}

function hexA(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`;
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 13px ui-sans-serif, system-ui, sans-serif';
  for (const p of game.popups) {
    ctx.globalAlpha = Math.min(1, p.life / p.maxLife * 1.6);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillText(p.text, p.x + 1, p.y + 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawGhost() {
  // placement preview
  if (game.selectedType && game.hover) {
    const { col, row } = game.hover;
    const info = TOWER_TYPES[game.selectedType];
    if (col >= 0 && row >= 0 && col < COLS && row < ROWS) {
      const ok = buildableTile(col, row) && game.gold >= info.cost;
      drawRange((col + 0.5) * TILE, (row + 0.5) * TILE, info.levels[0].range, ok);
      drawTower({ type: game.selectedType, col, row, angle: -Math.PI / 2, level: 1 }, true);
      if (!ok) {
        const x = (col + 0.5) * TILE;
        const y = (row + 0.5) * TILE;
        ctx.strokeStyle = 'rgba(255,90,90,0.9)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x - 10, y - 10); ctx.lineTo(x + 10, y + 10);
        ctx.moveTo(x + 10, y - 10); ctx.lineTo(x - 10, y + 10);
        ctx.stroke();
      }
    }
  }
  // selected tower range
  if (game.selectedTower) {
    const s = game.selectedTower.stats();
    drawRange(game.selectedTower.x, game.selectedTower.y, s.range, true);
  }
}

function drawBanner() {
  const b = game.banner;
  if (!b) return;
  const k = b.life / b.maxLife;
  const alpha = k > 0.85 ? (1 - k) / 0.15 : Math.min(1, k / 0.3);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.font = '800 26px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText(b.text, W / 2 + 2, 42);
  ctx.fillStyle = b.color;
  ctx.fillText(b.text, W / 2, 40);
  ctx.globalAlpha = 1;
}

function drawPause() {
  ctx.fillStyle = 'rgba(8,11,20,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = '800 30px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W / 2, H / 2);
}

function render() {
  ctx.save();
  if (game.shake > 0) {
    ctx.translate((Math.random() - 0.5) * game.shake * 9, (Math.random() - 0.5) * game.shake * 9);
  }
  drawMap();
  for (const t of game.towers) drawTower(t);
  drawEnemies();
  drawProjectiles();
  drawEffects();
  drawPopups();
  drawGhost();
  drawBanner();
  ctx.restore();
  if (game.paused) drawPause();
}

/* ---------------------------- UI ----------------------------------------- */
const el = {
  lives: $('lives'), gold: $('gold'), wave: $('wave'), score: $('score'),
  startBtn: $('startBtn'), speedBtn: $('speedBtn'), pauseBtn: $('pauseBtn'),
  towerList: $('towerList'), nextWave: $('nextWave'),
  infoPanel: $('infoPanel'), ipSwatch: $('ipSwatch'), ipName: $('ipName'),
  ipLevel: $('ipLevel'), ipStats: $('ipStats'),
  upgradeBtn: $('upgradeBtn'), sellBtn: $('sellBtn'),
  overlay: $('overlay'), overlayTitle: $('overlayTitle'), overlayText: $('overlayText'),
  overlayStats: $('overlayStats'), restartBtn: $('restartBtn'),
  toast: $('toast'),
};

let toastTimer = null;
function toast(msg) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1600);
}

function showOverlay(title, text, win) {
  el.overlayTitle.textContent = title;
  el.overlayTitle.className = win ? 'win' : 'lose';
  el.overlayText.textContent = text;
  el.overlayStats.innerHTML =
    `<div>Waves<b>${game.wave}</b></div>` +
    `<div>Kills<b>${game.kills}</b></div>` +
    `<div>Lives left<b>${game.lives}</b></div>` +
    `<div>Score<b>${game.score}</b></div>`;
  el.overlay.classList.remove('hidden');
}

function hideOverlay() { el.overlay.classList.add('hidden'); }

// tower cards
function buildTowerCards() {
  el.towerList.innerHTML = '';
  for (const id of TOWER_ORDER) {
    const t = TOWER_TYPES[id];
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'tower-card';
    card.dataset.type = id;
    card.innerHTML =
      `<span class="swatch" style="background:${t.color}"></span>` +
      `<span class="tc-body">` +
      `<span class="tc-name">${t.name}<span class="tc-cost">💰${t.cost}</span></span>` +
      `<span class="tc-desc">${t.desc}<span class="tc-key">${t.key}</span></span>` +
      `</span>`;
    card.addEventListener('click', () => selectTowerType(id));
    el.towerList.appendChild(card);
  }
}

function selectTowerType(id) {
  if (game.state === 'over' || game.state === 'won') return;
  game.selectedTower = null;
  game.selectedType = game.selectedType === id ? null : id;
}

function syncTowerCards() {
  for (const card of el.towerList.children) {
    const id = card.dataset.type;
    card.classList.toggle('selected', game.selectedType === id);
    card.classList.toggle('unaffordable', !canAfford(id));
  }
}

// info panel
let lastPanelTower;
function syncInfoPanel() {
  const t = game.selectedTower;
  if (!t) {
    el.infoPanel.classList.add('hidden');
    lastPanelTower = undefined;
    return;
  }
  el.infoPanel.classList.remove('hidden');

  const info = TOWER_TYPES[t.type];
  if (lastPanelTower !== t) {
    lastPanelTower = t;
    el.ipSwatch.style.background = info.color;
    el.ipName.textContent = info.name;
    el.upgradeBtn.onclick = upgradeSelected;
    el.sellBtn.onclick = sellSelected;
  }
  const s = t.stats();
  const next = info.levels[t.level];
  setText(el.ipLevel, `Level ${t.level} / ${info.levels.length}`);
  const extras = [];
  if (s.splash) extras.push(`Splash <b>${s.splash}</b>`);
  if (s.slow) extras.push(`Slow <b>${Math.round((1 - s.slow) * 100)}%</b> for <b>${s.slowDur}s</b>`);
  extras.push(`Pierce: <b>${info.pierce === 'none' ? '—' : info.pierce === 'half' ? '50% armour' : 'all armour'}</b>`);
  el.ipStats.innerHTML =
    `Damage <b>${s.dmg}</b> · Rate <b>${(1 / s.rate).toFixed(1)}/s</b> · Range <b>${s.range}</b><br>` +
    extras.join(' · ');

  if (next) {
    setText(el.upgradeBtn, `⬆ Upgrade  💰${next.cost}`);
    el.upgradeBtn.disabled = game.gold < next.cost;
  } else {
    setText(el.upgradeBtn, 'Max level');
    el.upgradeBtn.disabled = true;
  }
  setText(el.sellBtn, `Sell  +${Math.round(t.spent * SELL_RATIO)}`);
  el.sellBtn.disabled = false;
}

function syncUI() {
  setText(el.lives, String(game.lives));
  setText(el.gold, String(game.gold));
  setText(el.wave, `${game.wave} / ${MAX_WAVES}`);
  setText(el.score, String(game.score));
  setText(el.nextWave, waveSummary(game.wave + 1));

  const idle = game.state === 'idle';
  const canEarly = game.state === 'wave' && game.queue.length === 0 && game.enemies.length > 0;
  const dead = game.state === 'over' || game.state === 'won';
  el.startBtn.disabled = dead || game.paused || (!idle && !canEarly);
  if (dead) setText(el.startBtn, 'Game finished');
  else if (idle) setText(el.startBtn, `▶ Start Wave ${game.wave + 1}`);
  else if (canEarly) setText(el.startBtn, `⏭ Call Wave ${game.wave + 1} early  (+${game.enemies.length * 8} 💰)`);
  else setText(el.startBtn, `⚔ Wave ${game.wave} in progress…`);

  setText(el.speedBtn, `Speed ${game.speed}x`);
  setText(el.pauseBtn, game.paused ? 'Resume' : 'Pause');

  syncTowerCards();
  syncInfoPanel();
}

/* ---------------------------- Input -------------------------------------- */
function mousePos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height),
  };
}

canvas.addEventListener('mousemove', (e) => {
  const p = mousePos(e);
  game.hover = { x: p.x, y: p.y, col: Math.floor(p.x / TILE), row: Math.floor(p.y / TILE) };
});
canvas.addEventListener('mouseleave', () => { game.hover = null; });

canvas.addEventListener('click', (e) => {
  if (game.state === 'over' || game.state === 'won') return;
  const p = mousePos(e);
  const col = Math.floor(p.x / TILE);
  const row = Math.floor(p.y / TILE);
  const existing = towerAt(col, row);
  if (game.selectedType) {
    if (existing) {                 // clicking a tower while placing selects it instead
      game.selectedType = null;
      game.selectedTower = existing;
      return;
    }
    tryPlace(col, row);
  } else {
    game.selectedTower = existing || null;
  }
});

canvas.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  game.selectedType = null;
});

el.startBtn.addEventListener('click', startWave);
el.speedBtn.addEventListener('click', () => { game.speed = game.speed === 1 ? 2 : 1; });
el.pauseBtn.addEventListener('click', () => { game.paused = !game.paused; });
el.restartBtn.addEventListener('click', resetGame);

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { game.selectedType = null; game.selectedTower = null; }
  else if (e.code === 'Space') { e.preventDefault(); startWave(); }
  else if (e.key >= '1' && e.key <= '4') selectTowerType(TOWER_ORDER[Number(e.key) - 1]);
});

/* ---------------------------- Main loop ---------------------------------- */
let lastTime = performance.now();
function frame(now) {
  const raw = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (!game.paused && game.state !== 'over' && game.state !== 'won') {
    let total = raw * game.speed;
    let guard = 0;
    while (total > 0 && guard++ < 8) {
      const step = Math.min(total, 1 / 60);
      update(step);
      total -= step;
    }
  }

  render();
  syncUI();
  requestAnimationFrame(frame);
}

/* ---------------------------- Boot --------------------------------------- */
buildTowerCards();
resetGame();
requestAnimationFrame(frame);

    
  </script>
</body>
</html>
